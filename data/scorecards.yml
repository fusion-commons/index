# "Which code should I use?" scorecards, rendered into the README under their category.
# Editorial guidance for newcomers — details evolve, so read each code's docs before committing.
# Cell values are plain text; 🟩 = easy/yes, 🟨 = moderate/partial, — = no / not applicable.

scorecards:
