    title: Choosing an equilibrium code
    note: Editorial guidance for newcomers — start here, then read each code's documentation.
    columns: [Code, Geometry, First run, GPU, License]
    rows:
      - ["[FreeGS](https://github.com/freegs-plasma/freegs)", "Tokamak (free boundary)", "🟩 pip install, laptop", "—", "🟢 open"]
