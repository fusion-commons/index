name: Refresh project health

on:
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Fetch stars & activity for indexed repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_health.py
      - name: Commit if changed
        run: |
          git config user.name "fusion-commons-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/health.json
          git diff --cached --quiet || git commit -m "Nightly project-health refresh"
          git push
