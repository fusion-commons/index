name: README is generated

on:
  pull_request:
    paths: ["README.md", "data/**", "templates/**", "scripts/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Verify README.md matches data/
        run: python scripts/build_readme.py --check
