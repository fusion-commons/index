name: Check links

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  pull_request:
    paths: ["README.md", "CONTRIBUTING.md", "data/**", "guides/**"]
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --exclude tendl\.web\.psi\.ch
            --exclude euro-fusion\.org
            --exclude mastapp\.site
            --accept 200,201,202,203,204,206,301,302,303,307,308,403,429
            README.md CONTRIBUTING.md guides/*.md
          fail: false
      - name: Open issue on broken links (scheduled run)
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5
        with:
          title: "Weekly link check found broken links"
          content-filepath: ./lychee/out.md
          labels: broken-link
      - name: Fail the run on broken links (pull requests)
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'pull_request'
        run: |
          echo "Broken links found in this PR — see the lychee report above."
          exit 1
