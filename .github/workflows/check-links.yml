name: Check links

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  pull_request:
    paths: ["README.md", "CONTRIBUTING.md", "data/**", "guides/**"]
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --exclude tendl\.web\.psi\.ch
            --exclude euro-fusion\.org
            --exclude mastapp\.site
            --accept 200,201,202,203,204,206,301,302,303,307,308,403,429
            README.md CONTRIBUTING.md guides/*.md
          fail: false
      - name: Open or refresh the standing link-check issue (scheduled run)
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuse ONE standing issue instead of opening a new one every week:
          # find the most recent broken-link issue (open or closed), refresh its body
          # and reopen it; create it only the first time.
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --label broken-link --state all \
                  --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --body-file ./lychee/out.md
            gh issue reopen "$num" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            echo "Refreshed standing link-check issue #$num"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Weekly link check found broken links" \
              --label broken-link --body-file ./lychee/out.md
            echo "Created standing link-check issue"
          fi
      - name: Fail the run on broken links (pull requests)
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'pull_request'
        run: |
          echo "Broken links found in this PR — see the lychee report above."
          exit 1
